name: Godot 4.7.2 animation validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  animation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_SILENCE_ROOT_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Verify baked character and source fingerprints
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('assets/animations/combat_manifest.json').read_text())
          assert hashlib.sha256(Path('assets/characters/rigged.glb').read_bytes()).hexdigest() == manifest['target_sha256']
          for name, expected in manifest['source_sha256'].items():
              assert hashlib.sha256((Path('assets/animations/source') / name).read_bytes()).hexdigest() == expected, name
          PY
      - name: Import and run animation contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/import.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/animation_contract.gd 2>&1 | tee /tmp/contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/contract.log
          grep -F 'ANIMATION CONTRACT: PASS' /tmp/contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/storm_slice_contract.gd 2>&1 | tee /tmp/storm-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/storm-contract.log
          grep -F 'STORM SLICE CONTRACT: PASS' /tmp/storm-contract.log

          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/naruto_phase1_contract.gd 2>&1 | tee /tmp/naruto-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/naruto-contract.log
          grep -F 'NARUTO PHASE 1 CONTRACT: PASS' /tmp/naruto-contract.log
      - name: Validate release provenance gate
        run: |
          python tools/validate_release_assets.py
          python -m unittest discover -s tests -p 'test_release_assets.py'
      - name: Verify isolated Android payload and public gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack Android /tmp/android-phase1.pck 2>&1 | tee /tmp/dev-export.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/dev-export.log
          # Backends may still write an empty container on export error. Verify contents.
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack 'Android (Play Store)' /tmp/blocked-public.pck 2>&1 | tee /tmp/public-export.log
          grep -F 'Export público bloqueado; payload excluído.' /tmp/public-export.log
          ! grep -F 'SCRIPT ERROR:' /tmp/public-export.log
          cp tests/export_payload_contract.gd /tmp/export_payload_contract.gd
          cd /tmp
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --main-pack /tmp/android-phase1.pck --script /tmp/export_payload_contract.gd 2>&1 | tee /tmp/pack-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/pack-contract.log
          grep -F 'ANDROID PHASE 1 PACK: PASS' /tmp/pack-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --main-pack /tmp/blocked-public.pck --script /tmp/export_payload_contract.gd -- --public 2>&1 | tee /tmp/public-pack-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/public-pack-contract.log
          grep -F 'PUBLIC PAYLOAD GATE: PASS' /tmp/public-pack-contract.log
