name: Godot 4.7.2 animation validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  animation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_SILENCE_ROOT_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Verify baked character and source fingerprints
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('assets/animations/combat_manifest.json').read_text())
          assert hashlib.sha256(Path('assets/characters/rigged.glb').read_bytes()).hexdigest() == manifest['target_sha256']
          for name, expected in manifest['source_sha256'].items():
              assert hashlib.sha256((Path('assets/animations/source') / name).read_bytes()).hexdigest() == expected, name
          PY
      - name: Import and run animation contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/import.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/licensed_combat_skin_compile_contract.gd 2>&1 | tee /tmp/combat-skin-compile.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/combat-skin-compile.log
          grep -F 'LICENSED COMBAT SKIN COMPILE: PASS' /tmp/combat-skin-compile.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/animation_contract.gd 2>&1 | tee /tmp/contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/contract.log
          grep -F 'ANIMATION CONTRACT: PASS' /tmp/contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/storm_slice_contract.gd 2>&1 | tee /tmp/storm-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/storm-contract.log
          grep -F 'STORM SLICE CONTRACT: PASS' /tmp/storm-contract.log

          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/naruto_phase1_contract.gd 2>&1 | tee /tmp/naruto-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/naruto-contract.log
          grep -F 'NARUTO PHASE 1 CONTRACT: PASS' /tmp/naruto-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/cpu_rig_contract.gd 2>&1 | tee /tmp/cpu-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/cpu-contract.log
          grep -F 'CPU RIG CONTRACT: PASS' /tmp/cpu-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/moves_data_contract.gd 2>&1 | tee /tmp/moves-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/moves-contract.log
          grep -F 'MOVES DATA CONTRACT: PASS' /tmp/moves-contract.log
      - name: Validate shared combat state machine
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/combat_state_machine_contract.gd 2>&1 | tee /tmp/combat-state-machine.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/combat-state-machine.log
          grep -F 'COMBAT STATE MACHINE: PASS' /tmp/combat-state-machine.log
      - name: Validate supplied 3D mesh skin in all combat clips
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/base_basic_visual_contract.gd 2>&1 | tee /tmp/base-basic-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/base-basic-contract.log
          grep -F 'BASE BASIC VISUAL CONTRACT: PASS' /tmp/base-basic-contract.log
      - name: Validate Henrique protagonist, skin and Susanoo lifecycle
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/henrique_contract.gd 2>&1 | tee /tmp/henrique-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/henrique-contract.log
          grep -F 'HENRIQUE CONTRACT: PASS' /tmp/henrique-contract.log
      - name: Validate selectable fighters, CPU arsenal and rematch
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/selection_arsenal_contract.gd 2>&1 | tee /tmp/selection-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/selection-contract.log
          grep -F 'SELECTION ARSENAL CONTRACT: PASS' /tmp/selection-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/cpu_threat_contract.gd 2>&1 | tee /tmp/threat-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/threat-contract.log
          grep -F 'CPU THREAT CONTRACT: PASS' /tmp/threat-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/stylized_fighters_contract.gd 2>&1 | tee /tmp/stylized-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/stylized-contract.log
          grep -F 'STYLIZED FIGHTERS CONTRACT: PASS' /tmp/stylized-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/storm1_roster_contract.gd 2>&1 | tee /tmp/storm1-roster-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/storm1-roster-contract.log
          grep -F 'STORM 1 ROSTER CONTRACT: PASS' /tmp/storm1-roster-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/full_roster_specials_contract.gd 2>&1 | tee /tmp/full-roster-specials.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/full-roster-specials.log
          grep -F 'FULL ROSTER SPECIALS CONTRACT: PASS' /tmp/full-roster-specials.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/full_roster_power_contract.gd 2>&1 | tee /tmp/full-roster-power.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/full-roster-power.log
          grep -F 'FULL ROSTER POWER CONTRACT: PASS' /tmp/full-roster-power.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/roster_identity_contract.gd 2>&1 | tee /tmp/roster-identity.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/roster-identity.log
          grep -F 'ROSTER IDENTITY CONTRACT: PASS' /tmp/roster-identity.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/roster_visual_identity_contract.gd 2>&1 | tee /tmp/roster-visual-identity.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/roster-visual-identity.log
          grep -F 'ROSTER VISUAL IDENTITY CONTRACT: PASS' /tmp/roster-visual-identity.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/roster_model_slot_contract.gd 2>&1 | tee /tmp/roster-model-slot.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/roster-model-slot.log
          grep -F 'ROSTER MODEL SLOT CONTRACT: PASS' /tmp/roster-model-slot.log
      - name: Validate character jutsu data and physical Sakura traps
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/character_jutsus_contract.gd 2>&1 | tee /tmp/character-jutsus.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/character-jutsus.log
          grep -F 'CHARACTER JUTSUS CONTRACT: PASS' /tmp/character-jutsus.log
      - name: Validate world traversal and mission lifecycle
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/world_contract.gd 2>&1 | tee /tmp/world-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/world-contract.log
          grep -F 'WORLD CONTRACT: PASS' /tmp/world-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/world_flow_contract.gd 2>&1 | tee /tmp/world-flow-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/world-flow-contract.log
          grep -F 'WORLD FLOW CONTRACT: PASS' /tmp/world-flow-contract.log
      - name: Validate RPG story, regions and progression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/rpg_story_contract.gd 2>&1 | tee /tmp/rpg-story-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/rpg-story-contract.log
          grep -F 'RPG STORY CONTRACT: PASS' /tmp/rpg-story-contract.log
      - name: Validate anime presentation and mobile quality
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/anime_presentation_contract.gd 2>&1 | tee /tmp/anime-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/anime-contract.log
          grep -F 'ANIME PRESENTATION CONTRACT: PASS' /tmp/anime-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/mobile_combat_readability_contract.gd 2>&1 | tee /tmp/mobile-readability.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/mobile-readability.log
          grep -F 'MOBILE COMBAT READABILITY: PASS' /tmp/mobile-readability.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/visual_overhaul_contract.gd 2>&1 | tee /tmp/visual-overhaul.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/visual-overhaul.log
          grep -F 'VISUAL OVERHAUL CONTRACT: PASS' /tmp/visual-overhaul.log
      - name: Validate licensed gameplay assets and mobile budgets
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/licensed_gameplay_assets_contract.gd 2>&1 | tee /tmp/licensed-assets.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/licensed-assets.log
          grep -F 'LICENSED GAMEPLAY ASSETS: PASS' /tmp/licensed-assets.log
      - name: Compile anime shaders in OpenGL Compatibility
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/anime_presentation_contract.gd -- --capture --capture-dir=/tmp/mobile-captures 2>&1 | tee /tmp/anime-opengl.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/anime-opengl.log
          grep -F 'ANIME PRESENTATION CONTRACT: PASS' /tmp/anime-opengl.log
      - name: Compile licensed effects and NPC materials in OpenGL
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/licensed_gameplay_assets_contract.gd 2>&1 | tee /tmp/licensed-opengl.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/licensed-opengl.log
          grep -F 'LICENSED GAMEPLAY ASSETS: PASS' /tmp/licensed-opengl.log
      - name: Upload gameplay presentation captures
        uses: actions/upload-artifact@v4
        with:
          name: mobile-presentation-captures
          path: /tmp/mobile-captures/*.png
          if-no-files-found: error
      - name: Validate Storm research bridges
        run: |
          python -m unittest discover -s tests -p 'test_storm1_research_tools.py'
      - name: Validate 100 new clips, gallery and Susanoo impact timing
        shell: bash
        run: |
          set -o pipefail
          python -m pip install numpy scipy Pillow
          python -m unittest discover -s tests -p 'test_combat_expansion.py'
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/combat_expansion_contract.gd 2>&1 | tee /tmp/combat-expansion.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/combat-expansion.log
          grep -F 'COMBAT EXPANSION CONTRACT: PASS' /tmp/combat-expansion.log
      - name: Validate release provenance gate
        run: |
          python tools/validate_release_assets.py
          python -m unittest discover -s tests -p 'test_release_assets.py'
      - name: Verify isolated Android payload and public gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack Android /tmp/android-phase1.pck 2>&1 | tee /tmp/dev-export.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/dev-export.log
          # Backends may still write an empty container on export error. Verify contents.
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack 'Android (Play Store)' /tmp/blocked-public.pck 2>&1 | tee /tmp/public-export.log
          grep -F 'Export público bloqueado; payload excluído.' /tmp/public-export.log
          ! grep -F 'SCRIPT ERROR:' /tmp/public-export.log
          cp tests/export_payload_contract.gd /tmp/export_payload_contract.gd
          cd /tmp
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --main-pack /tmp/android-phase1.pck --script /tmp/export_payload_contract.gd 2>&1 | tee /tmp/pack-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/pack-contract.log
          grep -F 'ANDROID PHASE 1 PACK: PASS' /tmp/pack-contract.log
          grep -F 'CHARACTER JUTSU DATA ANDROID PACK: PASS' /tmp/pack-contract.log
          grep -F 'WORLD ANDROID PACK: PASS' /tmp/pack-contract.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --main-pack /tmp/blocked-public.pck --script /tmp/export_payload_contract.gd -- --public 2>&1 | tee /tmp/public-pack-contract.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/public-pack-contract.log
          grep -F 'PUBLIC PAYLOAD GATE: PASS' /tmp/public-pack-contract.log
