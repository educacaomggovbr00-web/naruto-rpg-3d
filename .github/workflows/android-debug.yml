name: Android test APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'tools/*android*.py'
      - 'scripts/**'
      - 'assets/animations/**'
      - 'assets/characters/henrique/**'
      - 'assets/susanoo/**'
      - 'assets/world/**'
      - 'assets/asset_registry.json'
      - 'tests/*contract.gd'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK and matching Godot templates
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p /tmp/godot
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 --output /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python tools/setup_android_export.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --sdk "$ANDROID_HOME" --java "$JAVA_HOME" --templates /tmp/templates.tpz
      - name: Import, validate and export development APK
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/import.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/henrique_contract.gd 2>&1 | tee /tmp/henrique.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/henrique.log
          grep -F 'HENRIQUE CONTRACT: PASS' /tmp/henrique.log
          for contract in evolution arcade_modes henrique_campaign visible_evolution combat_input roster_authored_models jutsu_presentation presentation_quality fighter_polish android_stability scene_loading team_battle battle_interactions boss_mob jutsu_finish jutsu_construct jutsu_signature; do
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tests/${contract}_contract.gd" 2>&1 | tee "/tmp/${contract}.log"
            ! grep -E '^(SCRIPT ERROR:|ERROR:)' "/tmp/${contract}.log"
            grep -F 'CONTRACT: PASS' "/tmp/${contract}.log"
          done
          python tools/export_android.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --output build/naruto-rpg-3d-henrique-debug.apk 2>&1 | tee /tmp/export.log
          ! grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/export.log
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/naruto-rpg-3d-henrique-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 build/naruto-rpg-3d-henrique-debug.apk
          sha256sum build/naruto-rpg-3d-henrique-debug.apk > build/naruto-rpg-3d-henrique-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: naruto-rpg-3d-android-test
          path: |
            build/naruto-rpg-3d-henrique-debug.apk
            build/naruto-rpg-3d-henrique-debug.apk.sha256
          if-no-files-found: error
